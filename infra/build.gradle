plugins {
  id 'groovy'
  id 'java-library'
}

group = 'dev.thecook'

version = '0.1.0'

repositories {
  mavenCentral()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
  // CookToml returns core's CookbookRepositories, so callers compile against core.
  api 'dev.thecook:the-cook-core:0.1.0'
  implementation 'org.tomlj:tomlj:1.1.1'
  testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
  useJUnit()
  testLogging { events 'failed' }
}
