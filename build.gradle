plugins {
  id 'dev.thecook'
  id 'com.diffplug.spotless' version '8.10.4'
}

repositories {
  mavenCentral()
}

configurations {
  codenarc {
    attributes.attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
  }
}

dependencies {
  codenarc 'org.codenarc:CodeNarc:3.7.0-groovy-4.0'
}

cook.repository = file(providers.gradleProperty('repo').getOrElse('build/example'))
cook.recipe = providers.gradleProperty('recipe').getOrElse('development')
cook.cookbookDirectory = file('cookbook')

if (providers.gradleProperty('script').isPresent()) {
  cook.script = file(providers.gradleProperty('script').get())
}

cook.parameters = gradle.startParameter.projectProperties.findAll { !(it.key in ['repo', 'recipe', 'script']) }

spotless {
  def generated = ['**/build/**', '**/.gradle/**', '.cook/**']
  // The cookbook is a pseudo-language design sketch, not compiled Groovy.
  def sketch = ['cookbook/**']
  kotlin {
    target '**/*.kt'
    targetExclude generated
    ktlint('1.8.0').customRuleSets(['dev.thecook.lint:ktlint-rules:0.1.0'])
    // Baseline: files with braces violations that predate the rule.
    ['cli/src/main/kotlin/thecook/cli/terminal/CookCommand.kt', 'core/src/main/kotlin/thecook/application/CookService.kt'].each { baselined ->
      suppressLintsFor {
        step = 'ktlint'
        shortCode = 'thecook:mandatory-braces'
        path = baselined
      }
    }
  }
  groovy {
    target '**/*.groovy'
    targetExclude generated + sketch
    greclipse().configFile('gradle/spotless/greclipse.properties')
  }
  groovyGradle {
    target '**/*.gradle'
    targetExclude generated
    greclipse().configFile('gradle/spotless/greclipse.properties')
  }
  format 'misc', {
    target '**/*.md', '**/*.properties', '**/*.sh', '**/*.toml', '.gitignore'
    targetExclude generated + ['gradle/wrapper/**']
    trimTrailingWhitespace()
    endWithNewline()
  }
}

tasks.named('spotlessKotlin') {
  dependsOn gradle.includedBuild('ktlint-rules').task(':jar')
}

def codenarcArgs = { String report ->
  [
    '-basedir=.',
    '-includes=**/*.groovy,**/*.gradle',
    '-excludes=**/build/**,**/.gradle/**,.cook/**,cookbook/**',
    '-rulesetfiles=file:' + file('gradle/lint/codenarc.groovy'),
    '-failOnError=true',
    report,
  ]
}

tasks.register('codenarc', JavaExec) {
  description = 'Requires braces on Groovy and Gradle if/else/for/while bodies, except baselined violations.'
  group = 'verification'
  classpath = configurations.codenarc
  mainClass = 'org.codenarc.CodeNarc'
  args codenarcArgs('-report=console')
  args '-excludeBaseline=file:' + file('gradle/lint/codenarc-baseline.xml'), '-maxPriority1Violations=0', '-maxPriority2Violations=0', '-maxPriority3Violations=0'
}

tasks.register('codenarcBaseline', JavaExec) {
  description = 'Records the current CodeNarc violations as the baseline.'
  group = 'verification'
  classpath = configurations.codenarc
  mainClass = 'org.codenarc.CodeNarc'
  args codenarcArgs('-report=org.codenarc.report.BaselineXmlReportWriter:' + file('gradle/lint/codenarc-baseline.xml'))
}

tasks.named('check') {
  dependsOn 'codenarc', gradle.includedBuild('ktlint-rules').task(':check')
  dependsOn gradle.includedBuild('core').task(':check'), gradle.includedBuild('cli').task(':check')
  dependsOn gradle.includedBuild('docs').task(':check')
}

tasks.register('cliBuild') { dependsOn gradle.includedBuild('cli').task(':installDist') }

tasks.register('jpackage') {
  group = 'distribution'
  description = 'Build the CLI with a bundled Java runtime for this platform.'
  dependsOn gradle.includedBuild('cli').task(':jpackage')
}

tasks.register('jpackageTest') {
  group = 'verification'
  description = 'Build and smoke-test the packaged CLI.'
  dependsOn gradle.includedBuild('cli').task(':jpackageTest')
}
