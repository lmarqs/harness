import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

group = 'dev.thecook.lint'
version = '0.1.0'

repositories {
  mavenCentral()
}

kotlin {
  jvmToolchain(17)
  compilerOptions {
    // Spotless runs the rules on ktlint's own Kotlin runtime, which is older than the compiler used here.
    apiVersion = KotlinVersion.KOTLIN_2_2
    languageVersion = KotlinVersion.KOTLIN_2_2
  }
}

dependencies {
  compileOnly 'com.pinterest.ktlint:ktlint-cli-ruleset-core:1.8.0'
  compileOnly 'com.pinterest.ktlint:ktlint-rule-engine-core:1.8.0'
  testImplementation 'com.pinterest.ktlint:ktlint-cli-ruleset-core:1.8.0'
  testImplementation 'com.pinterest.ktlint:ktlint-rule-engine-core:1.8.0'
  testImplementation 'com.pinterest.ktlint:ktlint-test:1.8.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

tasks.named('test') {
  useJUnitPlatform()
}
