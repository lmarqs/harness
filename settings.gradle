pluginManagement {
  includeBuild('core')
}

rootProject.name = 'the-cook'

includeBuild('cli') { name = 'cli' }
includeBuild('cookbook/recipes/agentic/codex') { name = 'agentic-codex' }
includeBuild('cookbook/recipes/agentic/claude') { name = 'agentic-claude' }

includeBuild('cookbook/recipes/agentic/runtime') {
  name = 'agentic-runtime'
}

file('cookbook/ingredients').listFiles().findAll { new File(it, 'build.gradle').isFile() }.sort { it.name }.each { ingredient ->
  def buildName = ingredient.name == rootProject.name ? 'ingredient-' + ingredient.name : ingredient.name
  includeBuild(ingredient) { name = buildName }
}
