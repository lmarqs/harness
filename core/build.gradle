plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.4.20'
  id 'groovy'
  id 'java-gradle-plugin'
}

group = 'dev.thecook'

version = '0.1.0'

repositories {
  mavenCentral()
}

kotlin {
  jvmToolchain(17)
}

tasks.named('compileGroovy') {
  dependsOn tasks.named('compileKotlin')
  classpath += files(tasks.named('compileKotlin').flatMap { it.destinationDirectory })
}

dependencies {
  implementation localGroovy()
  implementation 'org.tomlj:tomlj:1.0.0'
  implementation 'org.yaml:snakeyaml:2.4'
  // Recipes and models import groovy.yaml and groovy.toml by default. They match the Groovy that runs them, which
  // already supplies the Groovy modules they depend on.
  ['groovy-yaml', 'groovy-toml'].each { module ->
    implementation("org.apache.groovy:${module}:${GroovySystem.version}") {
      exclude group: 'org.apache.groovy'
    }
  }
  testImplementation 'junit:junit:4.13.2'
}

gradlePlugin {
  plugins {
    cook { id = 'dev.thecook'; implementationClass = 'thecook.gradle.CookPlugin' }
  }
}

tasks.named('test') {
  useJUnit()
  systemProperty 'cook.report', layout.buildDirectory.file('reports/model-checks.json').get().asFile.absolutePath
  systemProperty 'cook.cookbook', file('../cookbook').absolutePath
  testLogging { events 'failed' }
}

tasks.register('modelChecks') {
  dependsOn 'test'
}
