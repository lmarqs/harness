plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.4.20'
  id 'groovy'
  id 'application'
}
group = 'dev.thecook'
version = '0.1.0'
repositories { mavenCentral() }
kotlin { jvmToolchain(17) }
dependencies {
  implementation 'dev.thecook:the-cook-core:0.1.0'
  runtimeOnly 'dev.thecook.ingredients:git:0.1.0'
  runtimeOnly 'dev.thecook.ingredients:ralph-tui:0.1.0'
  runtimeOnly 'dev.thecook.ingredients:skills:0.1.0'
  runtimeOnly 'dev.thecook.ingredients:agent-policy:0.1.0'
  runtimeOnly 'dev.thecook.ingredients:the-cook:0.1.0'
  runtimeOnly 'dev.thecook.recipes:agentic-codex:0.1.0'
  runtimeOnly 'dev.thecook.recipes:agentic-claude:0.1.0'
  testImplementation localGroovy()
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.tomlj:tomlj:1.0.0'
}
application {
  applicationName = 'the-cook'
  mainClass = 'thecook.cli.run.MainKt'
}
tasks.named('test') {
  exclude '**/JpackageTest*'
  useJUnit(); testLogging {
    events 'failed'
  }
}

apply from: 'gradle/jpackage.gradle'
