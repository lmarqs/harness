plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.4.20'
  id 'groovy'
  id 'application'
}
group = 'dev.thecook'
version = '0.1.0'
repositories { mavenCentral() }
kotlin { jvmToolchain(17) }
dependencies {
  implementation 'dev.thecook:the-cook-core:0.1.0'
  implementation 'info.picocli:picocli:4.7.7'
  implementation 'io.github.java-diff-utils:java-diff-utils:4.15'
  testImplementation localGroovy()
  testImplementation 'junit:junit:4.13.2'
}
application {
  applicationName = 'the-cook'
  mainClass = 'thecook.cli.run.MainKt'
}
tasks.named('test') {
  exclude '**/JpackageTest*'
  useJUnit(); testLogging {
    events 'failed'
  }
}

apply from: 'gradle/jpackage.gradle'
