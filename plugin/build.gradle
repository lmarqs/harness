plugins {
  id 'groovy'
  id 'java-gradle-plugin'
  id 'maven-publish'
}

group = 'dev.thecook'
version = '0.1.0'

repositories {
  mavenCentral()
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
  implementation 'org.tomlj:tomlj:1.0.0'
  testImplementation 'junit:junit:4.13.2'
}

gradlePlugin {
  plugins {
    cookbook { id = 'dev.thecook.cookbook'; implementationClass = 'thecook.gradle.CookbookPlugin' }
  }
}

// A Maven-local layout inside the build, so the tests resolve the published plugin without touching ~/.m2.
def testMavenLocal = layout.buildDirectory.dir('maven-local')

publishing {
  repositories {
    maven { name = 'testMavenLocal'; url = testMavenLocal }
  }
}

tasks.named('test') {
  useJUnit()
  dependsOn 'publishAllPublicationsToTestMavenLocalRepository'
  systemProperty 'thecook.mavenLocal', testMavenLocal.get().asFile.path
  systemProperty 'thecook.pluginVersion', version
}
