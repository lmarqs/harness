name: Build

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  main:
    permissions:
      contents: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed migrations files
        id: changedMigrationFiles
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/migration/**/*

      - name: Check Migrations Immutability
        if: |
          1 == 0
          || steps.changedMigrationFiles.outputs.modified_files_count > 0
          || steps.changedMigrationFiles.outputs.deleted_files_count > 0
          || steps.changedMigrationFiles.outputs.renamed_files_count > 0
        run: |
          echo "Error: Migrations should not be modified, deleted, or renamed after being committed"
          exit 1

      - uses: Medprev/medprev-github-actions/configure-aws-credentials@main
        with:
          awsAccessKeyId: ${{ secrets.AWS_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: Medprev/medprev-github-actions/codeartifact-auth@main
        with:
          packageType: npm

      - name: Install dependencies
        run: npm ci

      - name: Get changed ts files
        id: changedTsFiles
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/**/*.ts

      - name: Lint modified ts files
        if: steps.changedTsFiles.outputs.modified_files_count > 0 || steps.changedTsFiles.outputs.added_files_count > 0
        run: |
          npx eslint $MODIFIED_FILES $ADDED_FILES
        env:
          MODIFIED_FILES: ${{ steps.changedTsFiles.outputs.modified_files }}
          ADDED_FILES: ${{ steps.changedTsFiles.outputs.added_files }}

      - name: Run unit tests
        id: unit
        env:
          TEST_MAX_WORKERS: 100%
        run: npm run test:unit

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() && steps.unit.conclusion != 'skipped' }}
        with:
          report_paths: '.test-reports/medprev-rest-api_all_junit.xml'
          check_name: 'Unit Tests'
          require_tests: true
          fail_on_failure: true

      - name: Build
        run: npm run build

      - uses: Medprev/medprev-github-actions/amazon-ecr-login@main

      - uses: Medprev/medprev-github-actions/docker-setup@main

      - uses: Medprev/medprev-github-actions/docker-build-push@main

      - uses: Medprev/medprev-github-actions/git-release@main
